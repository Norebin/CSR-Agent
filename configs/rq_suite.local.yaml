rq1:
  description: Compare CSR-Agent against baseline LLM methods by SRR/CSR/SIR.
  methods:
  - name: csr-agent
    profile: null
    overrides: {}
  - name: gpt-5.2
    profile: null
    overrides:
      llm_api.enabled: true
      llm_api.base_url: https://api.chatanywhere.tech/v1
      llm_api.api_key_env: OPENAI_API_KEY
      models.planner_model: gpt-5.2
      models.executor_model: gpt-5.2
      models.reviewer_model: gpt-5.2
  - name: gemini-2.5-pro
    profile: null
    overrides:
      llm_api.enabled: true
      llm_api.base_url: https://generativelanguage.googleapis.com/v1beta/openai
      llm_api.api_key_env: GEMINI_API_KEY
      models.planner_model: gemini-2.5-pro
      models.executor_model: gemini-2.5-pro
      models.reviewer_model: gemini-2.5-pro
  - name: deepseek-v3.2
    profile: null
    overrides:
      llm_api.enabled: true
      llm_api.base_url: https://api.deepseek.com/v1
      llm_api.api_key_env: DEEPSEEK_API_KEY
      models.planner_model: deepseek-v3.2
      models.executor_model: deepseek-v3.2
      models.reviewer_model: deepseek-v3.2

